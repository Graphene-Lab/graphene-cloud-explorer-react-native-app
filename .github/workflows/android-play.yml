name: Android Google Play

on:
  workflow_dispatch:
    inputs:
      action:
        description: Verify, build, release, reuse a build, promote, or attach a Play-signed APK
        type: choice
        required: true
        default: build
        options:
          - verify
          - build
          - release
          - internal
          - promote
          - attach
      destination:
        description: Destination for action=release (both publishes GitHub first)
        type: choice
        required: false
        default: both
        options:
          - github
          - play
          - both
      build_run_id:
        description: Successful build run ID to upload (only used for internal; no rebuild)
        type: string
        required: false
      version_code:
        description: Internal versionCode to promote (blank = latest internal; only used for promote)
        type: string
        required: false
      release_tag:
        description: Existing GitHub release tag for APK attachment (only used for attach)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: google-play-explorer${{ inputs.action == 'verify' && '-verify' || '' }}
  cancel-in-progress: false

env:
  CI: 'true'
  FASTLANE_OPT_OUT_USAGE: '1'
  FASTLANE_SKIP_UPDATE_CHECK: '1'
  FASTLANE_SKIP_DOCS: '1'
  # Public app signing certificate from Play Console; this is not the upload key.
  PLAY_APP_SIGNING_SHA256: '99:B6:1E:21:1D:F1:66:90:31:3C:08:9D:3F:9C:3D:C2:D7:A9:B9:20:40:D7:9F:64:B0:BF:63:FB:AD:2D:DA:98'

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - run: npm run test:auth
      - run: npm run test:screens
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: node --test tests/android-publishing.test.mjs tests/play-build-artifact.test.mjs tests/release-workflow-cli.test.mjs tests/release-plan.test.mjs tests/github-release.test.mjs tests/github-release-apk.test.mjs
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: ruby tests/play_release_test.rb
      - run: ruby tests/play_apk_test.rb

  release:
    needs: tests
    # Only an explicit manual run on this repository's master may release.
    if: >-
      github.repository_id == '1016678903' &&
      github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: yarn

      - name: Select release steps
        id: plan
        env:
          RELEASE_ACTION: ${{ inputs.action }}
          RELEASE_DESTINATION: ${{ inputs.destination }}
          PLAY_BUILD_RUN_ID: ${{ inputs.build_run_id }}
          PLAY_VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/release-plan.mjs

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Validate release version
        if: steps.plan.outputs.prepare_release == 'true'
        run: ruby -r ./fastlane/release_config -r json -e 'File.write(File.join(ENV.fetch("RUNNER_TEMP"), "play-release-version.json"), JSON.generate(PlayRelease.version_info))'

      - name: Record version tag and publish GitHub Release first
        if: steps.plan.outputs.prepare_release == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_DESTINATION: ${{ inputs.destination }}
          RELEASE_VERSION_FILE: ${{ runner.temp }}/play-release-version.json
        run: node scripts/prepare-github-release.mjs

      - name: Resolve the tagged APK version
        if: steps.plan.outputs.attach_apk == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ACTION: ${{ inputs.action }}
          RELEASE_DESTINATION: ${{ inputs.destination }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION_FILE: ${{ runner.temp }}/play-release-version.json
        run: node scripts/github-release-apk.mjs resolve

      - name: Install JavaScript dependencies
        if: steps.plan.outputs.build_android == 'true'
        run: yarn install --frozen-lockfile --non-interactive

      - uses: actions/setup-java@v6.1.0
        if: steps.plan.outputs.prepare_signing == 'true' || steps.plan.outputs.attach_apk == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify upload key and restore Firebase configuration
        if: steps.plan.outputs.prepare_signing == 'true'
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          APP_UPLOAD_STORE_PASSWORD: ${{ secrets.APP_UPLOAD_STORE_PASSWORD }}
          APP_UPLOAD_KEY_ALIAS: ${{ secrets.APP_UPLOAD_KEY_ALIAS }}
          APP_UPLOAD_KEY_PASSWORD: ${{ secrets.APP_UPLOAD_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: node scripts/prepare-android-ci.mjs

      - uses: android-actions/setup-android@v4.0.4
        if: steps.plan.outputs.android_tools == 'true'

      - name: Install APK verification tools
        if: inputs.action == 'attach'
        run: sdkmanager 'build-tools;36.0.0'

      - name: Install Android build tools
        if: steps.plan.outputs.build_android == 'true'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'

      - uses: gradle/actions/setup-gradle@v6.4.0
        if: steps.plan.outputs.build_android == 'true'

      - name: Build signed release bundle
        if: steps.plan.outputs.build_android == 'true'
        env:
          ORG_GRADLE_PROJECT_APP_UPLOAD_STORE_PASSWORD: ${{ secrets.APP_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_APP_UPLOAD_KEY_ALIAS: ${{ secrets.APP_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_APP_UPLOAD_KEY_PASSWORD: ${{ secrets.APP_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          bundle exec fastlane android build_release

      - name: Save release bundle
        if: steps.plan.outputs.build_android == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: graphene-explorer-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Select a successful build for internal testing
        if: steps.plan.outputs.download_aab == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAY_BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: node scripts/resolve-play-build.mjs

      - name: Download the existing signed AAB
        if: steps.plan.outputs.download_aab == 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}
          artifact-ids: ${{ env.PLAY_AAB_ARTIFACT_ID }}
          path: android/app/build/outputs/bundle/release
          digest-mismatch: error

      # Authenticate after the native build so the short-lived credentials are fresh for upload.
      - name: Authenticate to Google Play
        if: steps.plan.outputs.authenticate_play == 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: graphene-play-publishing
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Verify Google Play access without publishing
        if: inputs.action == 'verify'
        run: bundle exec fastlane android verify_access

      - name: Publish to internal testing
        if: steps.plan.outputs.publish_internal == 'true'
        run: bundle exec fastlane android internal

      - name: Download the Play-signed universal APK
        if: steps.plan.outputs.attach_apk == 'true'
        timeout-minutes: 15
        run: bundle exec ruby scripts/download-play-apk.rb

      - name: Verify APK and attach it to the GitHub Release
        if: steps.plan.outputs.attach_apk == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ACTION: ${{ inputs.action }}
          RELEASE_DESTINATION: ${{ inputs.destination }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION_FILE: ${{ runner.temp }}/play-release-version.json
        run: node scripts/github-release-apk.mjs publish

      - name: Promote tested version to production
        if: inputs.action == 'promote'
        env:
          PLAY_VERSION_CODE: ${{ inputs.version_code }}
        run: bundle exec fastlane android promote version_code:"$PLAY_VERSION_CODE"

      - name: Remove restored credential files
        if: always() && steps.plan.outputs.prepare_signing == 'true'
        run: rm -f -- "$RUNNER_TEMP/graphenelab-upload.keystore" android/app/google-services.json
